<!-- Language switcher: dropdown, fixed top-right -->
<nav class="lang-switcher" aria-label="Language selection" #langSwitcherRef>
  <button
    type="button"
    class="lang-trigger"
    [attr.aria-expanded]="langMenuOpen"
    aria-haspopup="listbox"
    aria-label="Select language"
    (click)="toggleLangMenu()"
  >
    <span class="lang-trigger-flag">{{ currentLanguage.flag }}</span>
    <span class="lang-trigger-label">{{ currentLanguage.label }}</span>
    <span class="lang-trigger-icon" aria-hidden="true">▾</span>
  </button>
  @if (langMenuOpen) {
    <ul class="lang-dropdown" role="listbox" (click)="$event.stopPropagation()">
      @for (lang of supportedLanguages; track lang.code) {
        <li role="option" [attr.aria-selected]="currentLang === lang.code">
          <button
            type="button"
            class="lang-option"
            [class.active]="currentLang === lang.code"
            (click)="selectLanguage(lang.code)"
          >
            <span class="lang-option-flag">{{ lang.flag }}</span>
            <span class="lang-option-label">{{ lang.label }}</span>
          </button>
        </li>
      }
    </ul>
  }
</nav>

<div class="loading-screen-container" [class.hidden]="!isLoading">
  <div
    class="loading-login"
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      flex-direction: column;
      margin-top: 10%;
    "
  >
    <img src="logo1.png" class="loading-logo-img" alt="7 Groups of 8 Logo" />
    <div
      class="loading-login-content"
      style="
        display: flex;
        justify-content: center;
        position: absolute;
        bottom: 0;
        flex-direction: column;
        align-items: center;
        width: 37%;
      "
    >
      <!-- <div class="login-title" style="">7 GROUPS OF 8</div> -->
      <div class="loading-subtitle">{{ 'loading.subtitle' | translate }}</div>
    </div>
  </div>

  <div class="loading-text" style="text-align: center">
    {{ 'loading.loadingText' | translate }}
    <span style="color: transparent">
      {{ loadingDots }}
    </span>
  </div>
</div>
<!-- Animated Background -->
<div class="animated-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- Main Content -->
<main class="main-content" [class.visible]="!isLoading">
  <router-outlet />

  <footer class="app-footer">
    <p class="app-footer-copyright">{{ 'footer.copyright' | translate }}</p>
  </footer>
</main>
