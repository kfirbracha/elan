<!-- Language switcher: dropdown, fixed top-right -->

<nav class="app-nav" [class.is-scrolled]="isNavScrolled" aria-label="Language selection" #langSwitcherRef>
  <div class="app-main-logo">
    <img src="walk-logo-white.png" width="100%" alt="7 Groups of 8 Logo" />
  </div>
  <button type="button" class="lang-trigger" [attr.aria-expanded]="langMenuOpen" aria-haspopup="listbox"
    aria-label="Select language" (click)="toggleLangMenu()">
    <span class="lang-trigger-flag">{{ currentLanguage.flag }}</span>
    <span class="lang-trigger-label">{{ currentLanguage.label }}</span>
    <span class="lang-trigger-icon" aria-hidden="true">▾</span>
  </button>
  @if (langMenuOpen) {
  <ul class="lang-dropdown" role="listbox" (click)="$event.stopPropagation()">
    @for (lang of supportedLanguages; track lang.code) {
    <li role="option" [attr.aria-selected]="currentLang === lang.code">
      <button type="button" class="lang-option" [class.active]="currentLang === lang.code"
        (click)="selectLanguage(lang.code)">
        <span class="lang-option-label" >{{ 'lang.label' | translate }}</span>
      </button>
    </li>
    }
  </ul>
  }

</nav>

<app-loading-screen [isLoading]="isLoading"></app-loading-screen>


<!-- Main Content -->
<main class="main-content" [class.visible]="!isLoading">
  <router-outlet />

  <footer class="app-footer">
    <p class="app-footer-copyright">{{ 'footer.copyright' | translate }}</p>
  </footer>
</main>
